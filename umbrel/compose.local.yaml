# Local rehearsal of the packaged deployment: the same image an app store would install,
# reached over a published port instead of a real proxy. Not for anything reachable from
# outside this machine — `trusted-http-proxy` leaves session cookies unencrypted, which is
# only tolerable when the browser and the server share a host.
services:
  portal:
    build:
      context: ..
      dockerfile: umbrel/Dockerfile
    image: portal:local
    volumes:
      - portal-local-data:/data
    environment:
      PORTAL_BIND: 0.0.0.0:3000
      PORTAL_ASSETS_DIR: /opt/portal/web
      PORTAL_ACCESS_PROFILE: trusted-http-proxy
      # One variable drives both the published port and the origin, because the origin has
      # to be exactly what the browser types. Override when something already holds 3000:
      # `PORTAL_LOCAL_PORT=3100 docker compose -f ... up`.
      PORTAL_PUBLIC_ORIGIN: http://localhost:${PORTAL_LOCAL_PORT:-3000}
      PORTAL_SHUTDOWN_TIMEOUT_SECS: "110"
    ports:
      - "127.0.0.1:${PORTAL_LOCAL_PORT:-3000}:3000"
    # Matches the production grace period, so a Ctrl+C here exercises the same ordered
    # teardown the supervisor will allow.
    stop_grace_period: 120s

volumes:
  portal-local-data:
