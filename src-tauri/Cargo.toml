[package]
name = "portal"
version.workspace = true
description = "Portal desktop app (Tauri + React)"
edition.workspace = true
license.workspace = true

[lib]
name = "portal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
portal-core = { path = "../core" }
tokio.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
log.workspace = true
uuid.workspace = true
libc.workspace = true
minreq.workspace = true
# Decodes Tor's `tor/hostname` file in the maker's data dir — same format openswap itself uses.
serde_cbor.workspace = true
openswap.workspace = true
tauri-plugin-single-instance = "2"

# The About panel (src/about.rs). Already in the tree through Tauri's menu backend; named here
# only for the extra AppKit classes.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSAttributedString", "NSData", "NSDictionary", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSResponder", "NSAttributedString", "NSColor", "NSImage", "NSParagraphStyle", "NSText", "NSMenu", "NSMenuItem"] }

[features]
# Keep the in-app Tor fallback enabled. Users with an external Tor continue to
# use their own process and authentication choice; users without one can still
# start Portal without installing Tor separately.
default = ["embedded-tor"]
embedded-tor = ["portal-core/embedded-tor"]
