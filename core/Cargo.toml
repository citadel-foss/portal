[package]
name = "portal-core"
description = "Transport-free Portal services shared by the desktop and web hosts"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
openswap.workspace = true
electrum-client.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
tokio.workspace = true
uuid.workspace = true
libc.workspace = true
dirs.workspace = true
serde_cbor.workspace = true
argon2.workspace = true
zeroize.workspace = true
minreq.workspace = true
log4rs.workspace = true
# In-app update. ureq rather than minreq: it gives each resolved address its own connect
# timeout, and one of GitHub's release-asset addresses can black-hole a connection.
ureq = { version = "2", default-features = false, features = ["tls"] }
semver = "1"
sha2 = "0.10"

[features]
# Selected by each host, not here, so a headless build can opt out of the bundled Tor.
# Embeds the official Tor expert bundle for the build target (see build.rs).
default = []
embedded-tor = []

