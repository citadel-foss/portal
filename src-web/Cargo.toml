[package]
name = "portal-web"
description = "Self-hosted Portal web host"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
portal-core = { path = "../core" }
axum.workspace = true
tower-http.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
futures-util.workspace = true
async-stream.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
rand.workspace = true
uuid.workspace = true
log.workspace = true
minreq.workspace = true

[features]
# Matches the desktop default so a self-hosted install carries its own Tor.
default = ["embedded-tor"]
embedded-tor = ["portal-core/embedded-tor"]
