name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      openswap_sha:
        description: Exact OpenSwap master commit to build; empty keeps the normal dependency
        required: false
        default: ""
        type: string
      build_version:
        description: Display version reserved for this compatibility build
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            platform: ubuntu-22.04
            artifact: linux
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
          - name: macOS Universal
            platform: macos-latest
            artifact: mac
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            xdg-utils

      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        run: brew install automake autoconf libtool pkg-config

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: ${{ matrix.target }}

      - name: Set display version
        if: inputs.build_version != ''
        env:
          PORTAL_BUILD_VERSION: ${{ inputs.build_version }}
        run: python3 .github/scripts/build-version.py stamp

      - name: Pin and verify OpenSwap commit
        if: inputs.openswap_sha != ''
        env:
          OPENSWAP_SHA: ${{ inputs.openswap_sha }}
        run: bash .github/scripts/pin-openswap.sh

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          # Ad-hoc signing keeps unsigned macOS artifacts launchable after download.
          APPLE_SIGNING_IDENTITY: "-"
        with:
          args: --target ${{ matrix.target }} ${{ inputs.openswap_sha != '' && '-- --locked' || '' }}
          uploadWorkflowArtifacts: true
          # Named per platform: tauri-action's `[platform]` says "darwin" for macOS.
          workflowArtifactNamePattern: portal-${{ matrix.artifact }}-[arch]-[bundle]

      # Archive on macOS before the artifact store strips executable bits and symlinks.
      - name: Archive macOS application
        if: runner.os == 'macOS' && inputs.openswap_sha != ''
        run: |
          tar -czf portal-macos-universal.app.tar.gz \
            -C target/universal-apple-darwin/release/bundle/macos Portal.app

      - name: Upload macOS application archive
        if: runner.os == 'macOS' && inputs.openswap_sha != ''
        uses: actions/upload-artifact@v7
        with:
          name: portal-mac-universal-app-archive
          path: portal-macos-universal.app.tar.gz
          if-no-files-found: error

  # The single-file web host, for testers: the frontend is built into the binary, so there is
  # nothing to install beside it. The compatibility caller publishes these artifacts.
  web:
    name: Server ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            platform: ubuntu-22.04
            asset: linux-x86_64
          - name: Linux arm64
            platform: ubuntu-22.04-arm
            asset: linux-arm64
          - name: macOS Universal
            platform: macos-latest
            asset: mac-universal

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Embedded Tor is built from source (libtor, vendored OpenSSL).
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev pkg-config

      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        run: brew install automake autoconf libtool pkg-config

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: web-${{ matrix.asset }}

      - name: Set display version
        if: inputs.build_version != ''
        env:
          PORTAL_BUILD_VERSION: ${{ inputs.build_version }}
        run: python3 .github/scripts/build-version.py stamp

      - name: Pin and verify OpenSwap commit
        if: inputs.openswap_sha != ''
        env:
          OPENSWAP_SHA: ${{ inputs.openswap_sha }}
        run: bash .github/scripts/pin-openswap.sh

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npx tsc --noEmit && npx vite build --mode web

      - name: Build portal-web
        if: runner.os == 'Linux'
        env:
          PORTAL_EMBED_WEB: dist/web
        run: |
          cargo build --release ${{ inputs.openswap_sha != '' && '--locked' || '' }} -p portal-web
          mkdir out && cp target/release/portal-web out/portal-server

      - name: Build portal-web (universal)
        if: runner.os == 'macOS'
        env:
          PORTAL_EMBED_WEB: dist/web
        run: |
          cargo build --release ${{ inputs.openswap_sha != '' && '--locked' || '' }} -p portal-web --target aarch64-apple-darwin
          cargo build --release ${{ inputs.openswap_sha != '' && '--locked' || '' }} -p portal-web --target x86_64-apple-darwin
          mkdir out
          lipo -create -output out/portal-server \
            target/aarch64-apple-darwin/release/portal-web \
            target/x86_64-apple-darwin/release/portal-web
          # Ad-hoc, like the desktop app: an arm64 Mac refuses to run a binary with no signature.
          codesign --force --sign - out/portal-server

      # Zipped by the artifact store, which drops the executable bit; testers need
      # `chmod +x portal-server` after unzipping.
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: portal-server-${{ matrix.asset }}
          path: out/portal-server
          if-no-files-found: error
